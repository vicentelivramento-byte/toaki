<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>TÔAKI</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #E8392A; --dark: #111110; --mid: #1E1E1C;
      --surface: #252523; --border: rgba(255,255,255,0.08);
      --text: #F5F4F0; --muted: #888884; --green: #2ECC71;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--dark); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100dvh; display: flex; flex-direction: column; max-width: 430px; margin: 0 auto; overflow-x: hidden; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 52px 20px 16px; background: var(--dark); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
    .logo { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; display: flex; align-items: center; gap: 6px; }
    .logo-dot { width: 8px; height: 8px; background: var(--red); border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.7; } }
    .header-sub { font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }
    .map-wrap { position: relative; margin: 16px; border-radius: 16px; overflow: hidden; height: 200px; background: var(--surface); border: 1px solid var(--border); }
    #mapContainer { width: 100%; height: 100%; }
    .loading-map { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; height: 100%; color: var(--muted); font-size: 12px; }
    .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .location-badge { position: absolute; bottom: 10px; left: 10px; right: 10px; background: rgba(17,17,16,0.92); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
    .location-badge .pin { width: 8px; height: 8px; background: var(--red); border-radius: 50%; flex-shrink: 0; animation: pulse 2s infinite; }
    .location-text { flex: 1; font-size: 12px; color: var(--text); }
    .location-coords { font-size: 10px; color: var(--muted); }
    .section { padding: 0 16px; margin-bottom: 16px; }
    .section-label { font-size: 10px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
    .msg-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px; transition: border-color 0.2s; }
    .msg-box:focus-within { border-color: rgba(232,57,42,0.4); }
    .msg-icon { margin-top: 2px; opacity: 0.4; flex-shrink: 0; }
    textarea { background: transparent; border: none; outline: none; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; width: 100%; resize: none; line-height: 1.5; min-height: 44px; }
    textarea::placeholder { color: var(--muted); }
    .char-count { text-align: right; font-size: 10px; color: var(--muted); margin-top: 4px; }

    /* FOTO */
    .photo-area { margin: 0 16px 16px; }
    .photo-btn { width: 100%; padding: 12px; background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.15s; }
    .photo-btn:hover { border-color: var(--red); color: var(--red); }
    .photo-preview { position: relative; border-radius: 12px; overflow: hidden; margin-top: 8px; }
    .photo-preview img { width: 100%; height: 160px; object-fit: cover; display: block; border-radius: 12px; }
    .photo-remove { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; background: rgba(0,0,0,0.7); border: none; border-radius: 50%; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }

    .contacts-list { display: flex; flex-direction: column; gap: 6px; }
    .contact-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.15s; user-select: none; }
    .contact-item.selected { border-color: var(--red); background: rgba(232,57,42,0.08); }
    .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; font-family: 'Syne', sans-serif; flex-shrink: 0; }
    .contact-info { flex: 1; }
    .contact-name { font-size: 14px; font-weight: 500; color: var(--text); }
    .contact-phone { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .check-circle { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
    .contact-item.selected .check-circle { background: var(--red); border-color: var(--red); }
    .check-circle svg { opacity: 0; transition: opacity 0.15s; }
    .contact-item.selected .check-circle svg { opacity: 1; }
    .add-contact { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px dashed var(--border); border-radius: 12px; cursor: pointer; color: var(--muted); font-size: 13px; transition: all 0.15s; margin-top: 6px; }
    .add-contact:hover { border-color: var(--red); color: var(--red); }
    .send-wrap { padding: 16px; padding-bottom: 32px; }
    .send-btn { width: 100%; padding: 16px; background: var(--red); border: none; border-radius: 14px; color: #fff; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.05em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.15s; }
    .send-btn:active { transform: scale(0.98); opacity: 0.9; }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .send-badge { background: rgba(255,255,255,0.2); border-radius: 20px; padding: 2px 10px; font-size: 12px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 200; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal { background: var(--mid); border-radius: 20px 20px 0 0; padding: 24px 20px 40px; width: 100%; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); border-top: 1px solid var(--border); }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
    .modal-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .field { margin-bottom: 14px; }
    .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; display: block; margin-bottom: 6px; }
    .field input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; outline: none; transition: border-color 0.2s; }
    .field input:focus { border-color: rgba(232,57,42,0.5); }
    .modal-btn { width: 100%; padding: 14px; background: var(--red); border: none; border-radius: 12px; color: #fff; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .toast { position: fixed; bottom: 100px; left: 20px; right: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; font-size: 13px; text-align: center; z-index: 300; opacity: 0; transform: translateY(10px); transition: all 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-color: rgba(46,204,113,0.4); color: var(--green); }
    .toast.error { border-color: rgba(232,57,42,0.4); color: var(--red); }
    .av-1 { background: rgba(232,57,42,0.15); color: #E8392A; }
    .av-2 { background: rgba(46,204,113,0.12); color: #2ECC71; }
    .av-3 { background: rgba(52,152,219,0.12); color: #3498DB; }
    .av-4 { background: rgba(241,196,15,0.12); color: #F1C40F; }
    .av-5 { background: rgba(155,89,182,0.12); color: #9B59B6; }
    .profile-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(232,57,42,0.15); color: var(--red); border: none; font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">TÔAKI <div class="logo-dot"></div></div>
    <div class="header-sub">Diz onde estás</div>
  </div>
  <button class="profile-btn" id="profileBtn" onclick="openProfileModal()">?</button>
</header>

<div class="map-wrap">
  <div id="mapContainer" class="loading-map">
    <div class="spinner"></div>
    <span>A obter localização...</span>
  </div>
  <div class="location-badge" id="locationBadge" style="display:none;">
    <div class="pin"></div>
    <div class="location-text" id="locationText">A localizar...</div>
    <div class="location-coords" id="locationCoords">GPS exato</div>
  </div>
</div>

<div class="section">
  <div class="section-label">Mensagem <span style="color:#555;font-size:9px;text-transform:none;letter-spacing:0">(opcional)</span></div>
  <div class="msg-box">
    <svg class="msg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <textarea id="msgInput" rows="2" maxlength="120" placeholder="ex: Vem ter comigo, está ótimo aqui!" oninput="updateChar()"></textarea>
  </div>
  <div class="char-count"><span id="charCount">0</span>/120</div>
</div>

<!-- FOTO -->
<div class="photo-area">
  <div class="section-label" style="padding: 0 0 10px 0;">Foto <span style="color:#555;font-size:9px;text-transform:none;letter-spacing:0">(opcional)</span></div>
  <button class="photo-btn" onclick="document.getElementById('photoInput').click()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
    Tirar foto ou escolher da galeria
  </button>
  <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(event)">
  <div class="photo-preview" id="photoPreview" style="display:none;">
    <img id="photoImg" src="" alt="Foto">
    <button class="photo-remove" onclick="removePhoto()">✕</button>
  </div>
</div>

<div class="section">
  <div class="section-label">Notificar contactos</div>
  <div class="contacts-list" id="contactsList"></div>
  <div class="add-contact" onclick="openModal()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
      <line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>
    </svg>
    Adicionar contacto
  </div>
</div>

<div class="send-wrap">
  <button class="send-btn" id="sendBtn" onclick="sendLocation()" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
    Enviar localização
    <span class="send-badge" id="sendBadge">0</span>
  </button>
</div>

<!-- MODAL CONTACTO -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Novo contacto</div>
    <div class="field"><label>Nome</label><input type="text" id="newName" placeholder="ex: Ana Silva"></div>
    <div class="field"><label>Número WhatsApp (com indicativo)</label><input type="tel" id="newPhone" placeholder="ex: 351912345678"></div>
    <button class="modal-btn" onclick="addContact()">Guardar contacto</button>
  </div>
</div>

<!-- MODAL PERFIL -->
<div class="modal-overlay" id="profileOverlay" onclick="closeProfileOutside(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">O meu perfil</div>
    <div class="field"><label>O meu nome</label><input type="text" id="profileName" placeholder="ex: Vicente"></div>
    <button class="modal-btn" onclick="saveProfile()">Guardar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const GITHUB_BASE = 'https://vicentelivramento-byte.github.io/toaki/';
  let contacts = JSON.parse(localStorage.getItem('toaki_contacts') || '[]');
  if (contacts.length === 0) {
    contacts = [
      { id: 1, name: 'Carina', phone: '351963972876' },
      { id: 2, name: 'Liliana', phone: '351963972912' },
    ];
    saveContacts();
  }
  let userName = localStorage.getItem('toaki_name') || '';
  let selectedIds = new Set();
  let userLat = null, userLon = null;
  let photoData = null; // base64 da foto comprimida
  let photoUrl = null; // URL público da foto no Supabase Storage
  const avatarColors = ['av-1','av-2','av-3','av-4','av-5'];

  // SUPABASE
  const SUPABASE_URL = 'https://lwangbwlcfilfmtyotns.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_nmuB48FgsaK9YIf74GIk0Q_fBzGdcCTxAWjnXvNeIOZoFI';

  function updateProfileBtn() {
    document.getElementById('profileBtn').textContent = userName ? userName[0].toUpperCase() : '?';
  }
  updateProfileBtn();

  function saveContacts() { localStorage.setItem('toaki_contacts', JSON.stringify(contacts)); }
  function getInitials(name) { return name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase(); }

  function renderContacts() {
    const list = document.getElementById('contactsList');
    list.innerHTML = '';
    contacts.forEach((c, i) => {
      const selected = selectedIds.has(c.id);
      const div = document.createElement('div');
      div.className = 'contact-item' + (selected ? ' selected' : '');
      div.onclick = () => toggleContact(c.id);
      div.innerHTML = `
        <div class="avatar ${avatarColors[i % 5]}">${getInitials(c.name)}</div>
        <div class="contact-info">
          <div class="contact-name">${c.name}</div>
          <div class="contact-phone">+${c.phone}</div>
        </div>
        <div class="check-circle">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>`;
      list.appendChild(div);
    });
    updateSendBtn();
  }

  function toggleContact(id) {
    if (selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
    renderContacts();
  }

  function updateSendBtn() {
    const n = selectedIds.size;
    document.getElementById('sendBadge').textContent = n;
    document.getElementById('sendBtn').disabled = n === 0 || !userLat;
  }

  async function uploadFoto(base64) {
    try {
      // Converter base64 para blob
      const base64Data = base64.split(',')[1];
      const byteChars = atob(base64Data);
      const byteArr = new Uint8Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteArr[i] = byteChars.charCodeAt(i);
      const blob = new Blob([byteArr], { type: 'image/jpeg' });

      // Nome único para o ficheiro
      const filename = `foto_${Date.now()}_${Math.random().toString(36).substr(2, 6)}.jpg`;

      // Upload para Supabase Storage
      const response = await fetch(
        `${SUPABASE_URL}/storage/v1/object/fotos/${filename}`,
        {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'image/jpeg',
            'x-upsert': 'true'
          },
          body: blob
        }
      );

      if (response.ok) {
        photoUrl = `${SUPABASE_URL}/storage/v1/object/public/fotos/${filename}`;
        showToast('✓ Foto carregada!', 'success');
      } else {
        const err = await response.json();
        console.error('Supabase Storage error:', err);
        showToast('Erro ao carregar foto', 'error');
        photoUrl = null;
      }
    } catch (err) {
      console.error('Upload error:', err);
      showToast('Erro ao carregar foto', 'error');
      photoUrl = null;
    }
  }

  function handlePhoto(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const maxSize = 1200;
        let w = img.width, h = img.height;
        if (w > maxSize || h > maxSize) {
          if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
          else { w = Math.round(w * maxSize / h); h = maxSize; }
        }
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        photoData = canvas.toDataURL('image/jpeg', 0.8);
        document.getElementById('photoImg').src = photoData;
        document.getElementById('photoPreview').style.display = 'block';
        showToast('⏳ A carregar foto...', '');
        uploadFoto(photoData);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function removePhoto() {
    photoData = null;
    photoUrl = null;
    document.getElementById('photoPreview').style.display = 'none';
    document.getElementById('photoInput').value = '';
  }

  // LOCALIZAÇÃO
  function initLocation() {
    if (!navigator.geolocation) {
      document.getElementById('mapContainer').innerHTML = `<div class="loading-map"><span style="color:var(--red)">Geolocalização não suportada</span></div>`;
      return;
    }
    navigator.geolocation.watchPosition(
      pos => {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        showMap(userLat, userLon);
        updateSendBtn();
      },
      err => {
        document.getElementById('mapContainer').innerHTML = `<div class="loading-map"><span style="color:var(--red);text-align:center;padding:20px">Permissão de localização negada.<br>Ativa nas definições do browser.</span></div>`;
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  function showMap(lat, lon) {
    const container = document.getElementById('mapContainer');
    const mapUrl = `https://www.openstreetmap.org/export/embed.html?bbox=${lon-0.003},${lat-0.002},${lon+0.003},${lat+0.002}&layer=mapnik&marker=${lat},${lon}`;
    container.innerHTML = `<iframe src="${mapUrl}" width="100%" height="100%" style="border:0;" loading="lazy"></iframe>`;
    document.getElementById('locationBadge').style.display = 'flex';
    document.getElementById('locationText').textContent = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
    document.getElementById('locationCoords').textContent = '📍 GPS exato';
  }

  // ENVIAR
  function sendLocation() {
    if (selectedIds.size === 0 || !userLat) return;

    const msg = document.getElementById('msgInput').value.trim();
    const nome = encodeURIComponent(userName || 'Alguém');
    const ts = Date.now();

    let viewUrl = `${GITHUB_BASE}toaki_view.html?lat=${userLat}&lon=${userLon}&nome=${nome}&ts=${ts}`;
    if (msg) viewUrl += `&msg=${encodeURIComponent(msg)}`;
    if (photoUrl) viewUrl += `&photo=${encodeURIComponent(photoUrl)}`;

    let text = `📍 *TÔAKI* — ${userName || 'Alguém'} partilhou a localização!\nClica para ver:\n${viewUrl}`;
    if (msg) text += `\n\n💬 ${msg}`;

    const selected = contacts.filter(c => selectedIds.has(c.id));

    if (selected.length === 1) {
      window.location.href = `https://wa.me/${selected[0].phone}?text=${encodeURIComponent(text)}`;
    } else {
      selected.forEach((c, i) => {
        setTimeout(() => {
          window.open(`https://wa.me/${c.phone}?text=${encodeURIComponent(text)}`, '_blank');
        }, i * 1000);
      });
    }
    showToast(`✓ A enviar para ${selected.length} contacto${selected.length > 1 ? 's' : ''}!`, 'success');
  }

  // PERFIL
  function openProfileModal() {
    document.getElementById('profileName').value = userName;
    document.getElementById('profileOverlay').classList.add('open');
    setTimeout(() => document.getElementById('profileName').focus(), 300);
  }
  function closeProfileOutside(e) {
    if (e.target === document.getElementById('profileOverlay')) document.getElementById('profileOverlay').classList.remove('open');
  }
  function saveProfile() {
    const name = document.getElementById('profileName').value.trim();
    if (!name) { showToast('Escreve o teu nome!', 'error'); return; }
    userName = name;
    localStorage.setItem('toaki_name', name);
    updateProfileBtn();
    document.getElementById('profileOverlay').classList.remove('open');
    showToast(`✓ Olá, ${name}!`, 'success');
  }

  // CONTACTO
  function openModal() {
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('newName').focus(), 300);
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('newName').value = '';
    document.getElementById('newPhone').value = '';
  }
  function closeModalOutside(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  }
  function addContact() {
    const name = document.getElementById('newName').value.trim();
    const phone = document.getElementById('newPhone').value.trim().replace(/\D/g, '');
    if (!name || !phone) { showToast('Preenche o nome e o número!', 'error'); return; }
    contacts.push({ id: Date.now(), name, phone });
    saveContacts();
    renderContacts();
    closeModal();
    showToast(`✓ ${name} adicionado!`, 'success');
  }

  function updateChar() { document.getElementById('charCount').textContent = document.getElementById('msgInput').value.length; }
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `toast show ${type}`;
    setTimeout(() => { t.className = 'toast'; }, 3000);
  }

  if (!userName) setTimeout(() => openProfileModal(), 1000);
  renderContacts();
  initLocation();
</script>
</body>
</html>
