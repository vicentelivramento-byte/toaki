<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>TÔAKI</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --red: #E8392A; --dark: #111110; --mid: #1E1E1C; --surface: #252523; --border: rgba(255,255,255,0.08); --text: #F5F4F0; --muted: #888884; --green: #2ECC71; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--dark); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100dvh; display: flex; flex-direction: column; max-width: 430px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 52px 20px 16px; border-bottom: 1px solid var(--border); }
    .logo { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; display: flex; align-items: center; gap: 6px; }
    .logo-dot { width: 8px; height: 8px; background: var(--red); border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.7; } }
    .sender-card { margin: 20px 16px 0; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 14px; }
    .sender-avatar { width: 52px; height: 52px; border-radius: 50%; background: rgba(232,57,42,0.15); color: var(--red); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; flex-shrink: 0; }
    .sender-info { flex: 1; }
    .sender-name { font-size: 18px; font-weight: 600; font-family: 'Syne', sans-serif; }
    .sender-sub { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
    .live-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
    .map-wrap { margin: 16px; border-radius: 16px; overflow: hidden; height: 240px; background: var(--surface); border: 1px solid var(--border); position: relative; }
    #map { width: 100%; height: 100%; }
    .map-overlay { position: absolute; bottom: 10px; left: 10px; right: 10px; background: rgba(17,17,16,0.92); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
    .pin-dot { width: 8px; height: 8px; background: var(--red); border-radius: 50%; flex-shrink: 0; animation: pulse 2s infinite; }
    .photo-card { margin: 0 16px 16px; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); }
    .photo-card img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
    .push-banner { margin: 0 16px 16px; background: rgba(46,204,113,0.08); border: 1px solid rgba(46,204,113,0.25); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 14px; }
    .push-icon { width: 40px; height: 40px; background: rgba(46,204,113,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
    .push-info { flex: 1; }
    .push-title { font-size: 13px; font-weight: 600; color: var(--text); font-family: 'Syne', sans-serif; }
    .push-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .push-btn { padding: 8px 14px; background: var(--green); border: none; border-radius: 10px; color: #fff; font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .push-btn:disabled { opacity: 0.5; }
    .msg-card { margin: 0 16px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .msg-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .msg-text { font-size: 15px; line-height: 1.5; color: var(--text); }
    .time-label { text-align: center; font-size: 11px; color: var(--muted); margin-bottom: 16px; }
    .actions { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 32px; }
    .btn { width: 100%; padding: 15px; border-radius: 14px; border: none; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-whatsapp { background: #25D366; color: #fff; }
    .btn:active { transform: scale(0.98); opacity: 0.9; }
    .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 80px auto; display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">TÔAKI <div class="logo-dot"></div></div>
    <div style="font-size:11px;color:var(--muted);margin-top:2px;">Localização partilhada</div>
  </div>
</header>

<div id="content"><div class="spinner"></div></div>

<script>
  const SUPABASE_URL = 'https://lwangbwlcfilfmtyotns.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3YW5nYndsY2ZpbGZtdHlvdG5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTc0MzAsImV4cCI6MjA5NTQ3MzQzMH0.tXRnN-UC8Skur6iQyt8rIsa4zQYGoiYj9EMDoJ6ox0c';
  const FCM_VAPID_KEY = 'BEWvhaQWffhZFRw7bRlQRENGWcw6Z7OQgHTckUEGadrRTcZFnGdTwTQ13RSqtnYvjGqDloQqdvIXTSgfyXnaVMU';

  function getParams() {
    const p = new URLSearchParams(window.location.search);
    return {
      lat:   parseFloat(p.get('lat')),
      lon:   parseFloat(p.get('lon')),
      nome:  p.get('nome') || 'Alguém',
      msg:   p.get('msg')  || '',
      ts:    p.get('ts')   || '',
      photo: p.get('photo')|| '',
      phone: p.get('phone')|| ''
    };
  }

  function getInitials(name) {
    return name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
  }

  function formatTime(ts) {
    if (!ts) return 'Agora mesmo';
    const d = new Date(parseInt(ts));
    const diff = Math.floor((Date.now() - d) / 60000);
    if (diff < 1) return 'Agora mesmo';
    if (diff < 60) return 'Ha ' + diff + ' minuto' + (diff > 1 ? 's' : '');
    if (diff < 1440) return 'Ha ' + Math.floor(diff/60) + ' hora' + (Math.floor(diff/60) > 1 ? 's' : '');
    return d.toLocaleString('pt-PT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function urlBase64ToUint8(b64) {
    const pad = '='.repeat((4 - b64.length % 4) % 4);
    const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from(raw, function(c) { return c.charCodeAt(0); });
  }

  async function registerPush(phone) {
    var btn = document.getElementById('pushBtn');
    var status = document.getElementById('pushStatus');
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      if (status) status.textContent = 'Notificacoes nao suportadas neste browser.';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'A ativar...';
    try {
      var reg = await navigator.serviceWorker.register('./sw.js');
      await navigator.serviceWorker.ready;

      var perm = await Notification.requestPermission();
      if (perm !== 'granted') {
        btn.textContent = 'Ativar'; btn.disabled = false;
        if (status) status.textContent = 'Permissao negada. Ativa nas definicoes do browser.';
        return;
      }

      var VAPID_KEY = 'BPAlPFXzeq7el-o42c5fwQ332fRHyxAVreur_SLUK6B25wdFPmWXEV1CmFqvey_InZuwbRElaVfO5bs5ovfp7R0';
      var sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8(VAPID_KEY)
      });

      var res = await fetch(SUPABASE_URL + '/rest/v1/push_subscriptions', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ phone: phone, subscription: sub.toJSON() })
      });

      if (res.ok || res.status === 201) {
        document.getElementById('pushBanner').innerHTML = '<div class="push-icon">\u2705</div><div class="push-info"><div class="push-title">Notificacoes ativas!</div><div class="push-sub">Vais receber alertas automaticamente.</div></div>';
        localStorage.setItem('toaki_push_phone', phone);
      } else {
        var errText = await res.text();
        throw new Error('Supabase: ' + errText);
      }
    } catch(err) {
      console.error('Push error:', err);
      if (btn) { btn.textContent = 'Ativar'; btn.disabled = false; }
      if (status) status.textContent = 'Erro: ' + err.message;
    }
  }

  function render() {
    var params = getParams();
    var lat   = params.lat;
    var lon   = params.lon;
    var nome  = params.nome;
    var msg   = params.msg;
    var ts    = params.ts;
    var photo = params.photo;
    var phone = params.phone;

    if (!lat || !lon) {
      document.getElementById('content').innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--muted)"><div style="font-size:40px;margin-bottom:16px">📍</div><div>Localizacao invalida</div></div>';
      return;
    }

    var mapsLink  = 'https://maps.google.com/?ll=' + lat + ',' + lon + '&q=' + lat + ',' + lon;
    var waReply   = 'https://wa.me/?text=' + encodeURIComponent('Recebi a tua localizacao pelo TOAKI!');
    var githubBase = 'https://vicentelivramento-byte.github.io/toaki/';
    var alreadySub = phone && localStorage.getItem('toaki_push_phone') === phone;

    var photoHtml = '';
    if (photo) {
      photoHtml = '<div class="photo-card"><img src="' + photo + '" alt="Foto do local" onerror="this.parentElement.style.display=\'none\'"></div>';
    }

    var pushHtml = '';
    if (phone) {
      if (alreadySub) {
        pushHtml = '<div class="push-banner" id="pushBanner"><div class="push-icon">\u2705</div><div class="push-info"><div class="push-title">Notificacoes ativas!</div><div class="push-sub">Recebes alertas automaticamente.</div></div></div>';
      } else {
        pushHtml = '<div class="push-banner" id="pushBanner"><div class="push-icon">\uD83D\uDD14</div><div class="push-info"><div class="push-title">Ativar notificacoes</div><div class="push-sub" id="pushStatus">Recebe alertas sem abrir a app.</div></div><button class="push-btn" id="pushBtn" onclick="registerPush(\'' + phone + '\')">Ativar</button></div>';
      }
    }

    var msgHtml = '';
    if (msg) {
      msgHtml = '<div class="msg-card"><div class="msg-label">Mensagem</div><div class="msg-text">\uD83D\uDCAC ' + msg + '</div></div>';
    }

    document.getElementById('content').innerHTML =
      '<div class="sender-card">' +
        '<div class="sender-avatar">' + getInitials(nome) + '</div>' +
        '<div class="sender-info">' +
          '<div class="sender-name">' + nome + '</div>' +
          '<div class="sender-sub"><div class="live-dot"></div>Partilhou a localizacao</div>' +
        '</div>' +
      '</div>' +
      '<div class="map-wrap">' +
        '<iframe id="map" src="https://www.openstreetmap.org/export/embed.html?bbox=' + (lon-0.003) + ',' + (lat-0.002) + ',' + (lon+0.003) + ',' + (lat+0.002) + '&layer=mapnik&marker=' + lat + ',' + lon + '" width="100%" height="100%" style="border:0;" loading="lazy"></iframe>' +
        '<div class="map-overlay"><div class="pin-dot"></div><span style="font-size:11px;color:var(--muted)">' + lat.toFixed(5) + ', ' + lon.toFixed(5) + '</span></div>' +
      '</div>' +
      photoHtml +
      pushHtml +
      msgHtml +
      '<div class="time-label">' + formatTime(ts) + '</div>' +
      '<div class="actions">' +
        '<a class="btn btn-primary" href="' + mapsLink + '" target="_blank"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Ver no Google Maps</a>' +
        '<a class="btn btn-whatsapp" href="' + waReply + '"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.532 5.862L.054 23.448a.5.5 0 0 0 .611.61l5.638-1.474A11.95 11.95 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.853 0-3.587-.5-5.084-1.375l-.362-.214-3.754.981.999-3.648-.235-.374A9.96 9.96 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>Responder no WhatsApp</a>' +
        '<a class="btn btn-secondary" href="' + githubBase + 'toaki.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Abrir o meu TOAKI</a>' +
      '</div>';
  }

  render();
</script>
</body>
</html>
