<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>TÔAKI</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #E8392A;
      --dark: #111110;
      --mid: #1E1E1C;
      --surface: #252523;
      --border: rgba(255,255,255,0.08);
      --text: #F5F4F0;
      --muted: #888884;
      --green: #2ECC71;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 430px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 52px 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo-dot {
      width: 8px; height: 8px;
      background: var(--red);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.7; }
    }

    .sender-card {
      margin: 20px 16px 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .sender-avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(232,57,42,0.15);
      color: var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .sender-info { flex: 1; }
    .sender-name { font-size: 18px; font-weight: 600; font-family: 'Syne', sans-serif; }
    .sender-sub { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
    .live-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }

    .map-wrap {
      margin: 16px;
      border-radius: 16px;
      overflow: hidden;
      height: 260px;
      background: var(--surface);
      border: 1px solid var(--border);
      position: relative;
    }

    #map { width: 100%; height: 100%; }

    .map-overlay {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(17,17,16,0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .pin-dot { width: 8px; height: 8px; background: var(--red); border-radius: 50%; flex-shrink: 0; animation: pulse 2s infinite; }

    .msg-card {
      margin: 0 16px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .msg-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .msg-text { font-size: 15px; line-height: 1.5; color: var(--text); }

    .time-label {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .actions {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 32px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
    }

    .btn-primary { background: var(--red); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-whatsapp { background: #25D366; color: #fff; }

    .btn:active { transform: scale(0.98); opacity: 0.9; }

    .spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 80px auto;
      display: block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">TÔAKI <div class="logo-dot"></div></div>
    <div style="font-size:11px;color:var(--muted);margin-top:2px;">Localização partilhada</div>
  </div>
</header>

<div id="content">
  <div class="spinner"></div>
</div>

<script>
  function getParams() {
    const p = new URLSearchParams(window.location.search);
    return {
      lat: parseFloat(p.get('lat')),
      lon: parseFloat(p.get('lon')),
      nome: p.get('nome') || 'Alguém',
      msg: p.get('msg') || '',
      ts: p.get('ts') || ''
    };
  }

  function getInitials(name) {
    return name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
  }

  function formatTime(ts) {
    if (!ts) return 'Agora mesmo';
    const d = new Date(parseInt(ts));
    const now = new Date();
    const diff = Math.floor((now - d) / 60000);
    if (diff < 1) return 'Agora mesmo';
    if (diff < 60) return `Há ${diff} minuto${diff > 1 ? 's' : ''}`;
    return d.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
  }

  function render() {
    const { lat, lon, nome, msg, ts } = getParams();

    if (!lat || !lon) {
      document.getElementById('content').innerHTML = `
        <div style="text-align:center;padding:60px 20px;color:var(--muted)">
          <div style="font-size:40px;margin-bottom:16px">📍</div>
          <div style="font-size:16px">Localização inválida</div>
        </div>`;
      return;
    }

    const mapsLink = `https://maps.google.com/?ll=${lat},${lon}&q=${lat},${lon}`;
    const waLink = `https://wa.me/?text=${encodeURIComponent(`Recebi a tua localização pelo TÔAKI! Já vi onde estás 👀`)}`;

    document.getElementById('content').innerHTML = `
      <div class="sender-card">
        <div class="sender-avatar">${getInitials(nome)}</div>
        <div class="sender-info">
          <div class="sender-name">${nome}</div>
          <div class="sender-sub">
            <div class="live-dot"></div>
            Partilhou a localização
          </div>
        </div>
      </div>

      <div class="map-wrap">
        <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${lon-0.003},${lat-0.002},${lon+0.003},${lat+0.002}&layer=mapnik&marker=${lat},${lon}" 
          width="100%" height="100%" style="border:0;" loading="lazy"></iframe>
        <div class="map-overlay">
          <div class="pin-dot"></div>
          <span style="font-size:11px;color:var(--muted)">${lat.toFixed(5)}, ${lon.toFixed(5)}</span>
        </div>
      </div>

      ${msg ? `
      <div class="msg-card">
        <div class="msg-label">Mensagem</div>
        <div class="msg-text">💬 ${msg}</div>
      </div>` : ''}

      <div class="time-label">${formatTime(ts)}</div>

      <div class="actions">
        <a class="btn btn-primary" href="${mapsLink}" target="_blank">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
          </svg>
          Ver no Google Maps
        </a>
        <a class="btn btn-whatsapp" href="${waLink}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
            <path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.532 5.862L.054 23.448a.5.5 0 0 0 .611.61l5.638-1.474A11.95 11.95 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.853 0-3.587-.5-5.084-1.375l-.362-.214-3.754.981.999-3.648-.235-.374A9.96 9.96 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
          </svg>
          Responder no WhatsApp
        </a>
        <a class="btn btn-secondary" href="toaki_4.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          Abrir o meu TÔAKI
        </a>
      </div>
    `;
  }

  render();
</script>
</body>
</html>
